name: Essayer
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  Essayer:
    type: application
    platform: iOS
    sources:
      - Essayer
    info:
      path: Essayer/Info.plist
      properties:
        CFBundleDisplayName: Essayer
        CFBundleLocalizations:
          - fr
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cabbry.essayer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signature manuelle avec le profil App Store : la CI ne passe que
        # l'identité. Pour un build local sur Mac : passer CODE_SIGN_STYLE à
        # Automatic et retirer PROVISIONING_PROFILE_SPECIFIER.
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Essayer AppStore"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
