name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: "Compilation seule (sans signature ni upload TestFlight)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Archive iOS & upload TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (dernier STABLE — Apple rejette les binaires RC/beta)
        run: |
          # Exclut les Xcode beta / Release Candidate : un binaire compilé avec
          # un Xcode non final passe l'upload mais est rejeté silencieusement
          # par App Store Connect (le build n'apparaît jamais dans TestFlight).
          pick() { ls -d /Applications/Xcode*.app 2>/dev/null \
                     | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1; }
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null \
                    | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(pick); fi
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Xcode disponibles :"; ls -d /Applications/Xcode*.app
          echo "Xcode sélectionné : $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Detect Apple secrets
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          if [ "$BUILD_ONLY" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Compilation seule demandée (workflow_dispatch build_only) : ni signature ni upload."
          elif [ -n "$ASC_KEY_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Secrets Apple présents : archive + upload TestFlight."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets Apple absents — build de validation sans signature uniquement (voir README pour configurer TestFlight)."
          fi

      - name: Build only (no signing — compile check)
        if: steps.secrets.outputs.present == 'false'
        run: |
          xcodebuild build \
            -project Essayer.xcodeproj \
            -scheme Essayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Install App Store Connect API key
        if: steps.secrets.outputs.present == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Install distribution certificate & profile (manual signing)
        if: steps.secrets.outputs.present == 'true'
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          # Keychain temporaire dédié au job
          KEYCHAIN=$RUNNER_TEMP/ci.keychain-db
          security create-keychain -p ci-password "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci-password "$KEYCHAIN"
          echo "$DIST_P12_B64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-password "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Profil de provisionnement App Store
          if [ -z "$PROVISIONING_PROFILE_B64" ]; then
            echo "::error::Secret PROVISIONING_PROFILE_B64 absent — voir README, « Mise en place TestFlight »."
            exit 1
          fi
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/essayer.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/essayer.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/essayer.mobileprovision" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/$UUID.mobileprovision
          cp "$RUNNER_TEMP/essayer.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Profil installé : $UUID"

      - name: Archive (manual signing — pas de création de certificat)
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Signature manuelle avec le certificat + profil déjà installés :
          # aucun -allowProvisioningUpdates, donc Xcode ne crée jamais de
          # certificat jetable (évite le plafond de certificats du compte).
          # Style Manual et PROVISIONING_PROFILE_SPECIFIER sont dans project.yml.
          xcodebuild archive \
            -project Essayer.xcodeproj \
            -scheme Essayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Essayer.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export & upload to App Store Connect
        if: steps.secrets.outputs.present == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cabbry.essayer</key><string>Essayer AppStore</string>
            </dict>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Essayer.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload archive as artifact (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive-logs
          path: build
          retention-days: 3
